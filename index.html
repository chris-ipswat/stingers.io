<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stingers INC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            max-width: 100px; /* Adjust the size of the logo as needed */
            margin-bottom: 20px; /* Space between logo and text */
        }
        .text {
            font-size: 24px;
        }
        .highlight {
            color: #007bff; /* Blue color */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.jpg" alt="Logo" class="logo">
        <div class="text">Welcome to Stingers , For IPRocketLab internship or IPV4/IPV6 Labs contact > <span class="highlight">IP@stingers.io</span></div>
    </div>
</body>
</html>
